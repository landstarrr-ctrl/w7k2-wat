name: 새 출처 시험 (SMTECH·로봇진흥원)

# 새로 추가한 일반 게시판을 읽을 수 있는지 시험합니다.
# 수동 실행 전용이며, 결과를 저장하거나 알림을 보내지 않습니다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 라이브러리 설치
        run: pip install --quiet -r requirements.txt
      - name: 게시판 확인 (저장 안 함)
        run: python monitor.py --only boards --dry-run
