name: 공고 감시

on:
  schedule:
       - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "알림 테스트만 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gonggo-monitor
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 알림 테스트
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notify }}
        run: python monitor.py --test-notify

      - name: 공고 확인
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify) }}
        run: python monitor.py

      - name: 변경 사항 저장
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "공고 갱신 $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash || true
            git push
          fi
