# ─────────────────────────────────────────────
# 공고 감시 설정 파일
# 이 파일만 고치면 감시 대상·키워드·대시보드 탭을 바꿀 수 있습니다.
# ─────────────────────────────────────────────
#
# [키워드 쓰는 법]
#   스마트공장            → 제목에 '스마트공장'이 있으면 잡음 (띄어쓰기·대소문자 무시)
#   AI + 제조|공장        → 'AI'가 있고, '제조' 또는 '공장'도 있을 때만 잡음
#                           ( + 는 '그리고',  | 는 '또는' )
#   영어 키워드(AI, AX, MES 등)는 단어 단위로만 잡습니다.
#   예) 'AI'는 'MAIN', 'TAX' 안의 글자를 잡지 않습니다.
#
# [탭] groups의 name 하나가 대시보드의 탭 하나가 됩니다.
#   한 공고가 여러 분류에 해당하면 여러 탭에 함께 나옵니다.
#   키워드를 바꾼 뒤 처음 실행하면, 새로 잡힌 기존 공고는 알림 대신
#   '키워드 변경으로 N건 추가' 요약 한 통만 보내고 대시보드에 '신규'로 표시합니다.

groups:
  - name: 제조AI·AX
    keywords:
      - 제조AI
      - AI공장
      - AI팩토리
      - AI 스마트공장
      - AX
      - AX 전환
      - Multi AI Agent
      - AI 에이전트
      - 온디바이스
      - AIoT
      - 머신비전
      - 비전검사
      - 예지보전
      - AI 바우처
      - AI + 제조|공장|공정|생산|뿌리|산업|도입|활용|전환|실증|중소|솔루션|에이전트|데이터|품질|설비
      - 인공지능 + 제조|공장|공정|생산|뿌리|산업|도입|활용|전환|실증|중소|솔루션|데이터

  - name: 스마트공장
    keywords:
      - 스마트공장
      - 스마트 팩토리
      - 스마트제조
      - 제조혁신
      - 제조 DX
      - 지역특화형
      - 수준확인
      - MES
      - DX + 제조|공장|생산|뿌리
      - 디지털 전환 + 제조|공장|생산|뿌리
      - 디지털화 + 제조|공장|생산|설비
      - 고도화 + 공장|제조|스마트

  - name: 자율형공장·디지털트윈
    keywords:
      - 자율형공장
      - 자율제조
      - 자율형 제조
      - 디지털트윈
      - 등대공장
      - AX선도
      - 선도형 + 공장|스마트|제조

  - name: 피지컬AI·로봇
    keywords:
      - 피지컬AI
      - Physical AI
      - 휴머노이드
      - 협동로봇
      - 제조로봇
      - 로봇 + 도입|실증|자동화|제조|공정|보급|활용|산업|뿌리|공장
      - 수작업 + 실증|대체|로봇|자동화
      - 위험 + 공정
      - 유해 + 공정

  - name: 자동화·공정혁신
    keywords:
      - 공정혁신
      - 공정최적화
      - 공정 개선
      - 공정자동화
      - 자동화 + 공정|설비|라인|생산|제조|공장
      - 설비 + 디지털|스마트|자동화|고도화

  - name: 데이터·솔루션·R&D
    keywords:
      - 제조데이터
      - KAMP
      - 클라우드 + 제조|솔루션|공장
      - 공급기업
      - 역량진단
      - DX 멘토
      - 멘토단 + 제조|DX|스마트
      - 스마트서비스
      - R&D + 제조|공정|스마트|로봇|자동화|AI
      - 기술개발 + 제조|공정|스마트|로봇|자동화|AI|산업|기계|장비
      - 산업기술개발

# 제목에 아래 단어가 있으면 키워드가 맞아도 제외합니다.
# 예) - 선정결과    - 합격자    (지금은 놓치지 않도록 비워 둠)
exclude: []

# true로 바꾸면 기업마당 공고의 '사업 요약'까지 키워드를 찾습니다.
# 더 많이 잡히지만 관련 없는 공고가 크게 늘어납니다.
match_summary: false

sources:
  # 기업마당 정책정보 API (BIZINFO_API_KEY 비밀값이 있어야 동작)
  bizinfo:
    enabled: true
    count: 300            # 한 번에 확인할 최신 공고 수

  # 중소벤처기업부 누리집 > 알림소식 > 사업공고 게시판
  mss:
    enabled: true
    url: https://www.mss.go.kr/site/smba/ex/bbs/List.do?cbIdx=310

  # KOSMO(스마트제조혁신추진단) 스마트공장 사업관리시스템 게시판
  # take_all: true → 키워드와 상관없이 모든 글을 수집하고, 키워드는 탭 분류에만 사용
  #                  (키워드에 안 맞는 글은 '기타' 탭으로)
  # run_on: github → GitHub 서버가 다른 출처와 함께 확인 (기본 추천)
  #        pc     → 사무실 PC 실행기에서만 확인, 대시보드는 PC 소식이
  #                 stale_minutes(분) 넘게 없으면 바로가기 안내를 띄움
  kosmo:
    enabled: true
    run_on: github
    stale_minutes: 150
    take_all: true
    boards:
      - name: KOSMO 사업공고
        url: https://www.smart-factory.kr/usr/bg/ba/ma/bsnsPbanc
      - name: KOSMO 모집공고
        url: https://www.smart-factory.kr/usr/bg/ra/ma/rcrtPbanc

  # IRIS 범부처통합연구지원시스템 > 사업공고 (정부 R&D 공고)
  # take_all_ministries에 적힌 부처 공고는 전부, 나머지 부처는 키워드에 맞는 것만 수집
  iris:
    enabled: true
    urls:
      - https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituListView.do
      - https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituListView.do?ancmPrg=ancmPre
    take_all_ministries:
      - 산업통상부
      - 산업통상자원부
      - 중소벤처기업부
    fetch_detail: true    # 새 공고는 상세 페이지에서 접수기간을 읽어 옴

  # 그 밖에 감시할 게시판 목록 주소 (선택)
  pages: []

dashboard:
  title: 정부지원과제 모니터링 시스템
  # 브라우저 탭에 보이는 이름 (비워 두면 title과 같음). 눈에 덜 띄게 하려면 평범한 이름으로
  tab_title: 업무 메모
  # 제목 아래 설명글 (비워 두면 표시 안 함)
  description: ""
  keep: 500               # 대시보드에 남길 최대 공고 수
  url: ""
