# ─────────────────────────────────────────────
# 공고 감시 설정 파일
# 이 파일만 고치면 감시 대상과 키워드를 바꿀 수 있습니다.
# ─────────────────────────────────────────────

# 공고 제목에 아래 단어 중 하나라도 들어 있으면 알림을 보냅니다.
# 띄어쓰기·대소문자는 무시합니다. ("스마트 공장" = "스마트공장")
keywords:
  - 스마트공장
  - 스마트제조
  - 제조AI
  - 자율형공장
  - 제조로봇
  - 로봇 도입
  - 자동화공정
  - 수준확인
  - 클라우드 종합솔루션
  - 공급기업 역량진단
  - DX 멘토
  - 제조데이터
  - 공정혁신
  - Multi AI Agent
  - 피지컬AI

# 제목에 아래 단어가 들어 있으면 키워드가 맞아도 제외합니다. (예: 선정결과)
exclude: []

# true로 바꾸면 기업마당 공고의 '사업 요약'까지 키워드를 찾습니다.
# 더 많이 잡히지만 관련 없는 공고도 섞일 수 있습니다.
match_summary: false

sources:
  # 기업마당 정책정보 API (BIZINFO_API_KEY 비밀값이 있어야 동작)
  bizinfo:
    enabled: true
    count: 200            # 한 번에 확인할 최신 공고 수

  # 중소벤처기업부 누리집 > 알림소식 > 사업공고 게시판
  mss:
    enabled: true
    url: https://www.mss.go.kr/site/smba/ex/bbs/List.do?cbIdx=310

  # 그 밖에 감시할 게시판 페이지 (목록 화면 주소)
  # 페이지 안의 링크 제목에서 키워드를 찾습니다.
  # 화면을 자바스크립트로 그리는 사이트는 동작하지 않을 수 있습니다.
  pages: []
  #  - name: 스마트공장 사업관리시스템
  #    url: https://www.smart-factory.kr/ (공지사항 목록 주소를 넣으세요)

dashboard:
  title: 스마트제조혁신 공고 감시
  keep: 300               # 대시보드에 남길 최대 공고 수
  # GitHub Pages 주소가 기본값과 다르면 직접 적어 주세요.
  url: ""
